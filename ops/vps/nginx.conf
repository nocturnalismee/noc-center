# NOC dashboard on a small VPS (spec §15.2).
#
# Debian 12 / Ubuntu 24.04, Nginx + PHP-FPM 8.4 (8.3 minimum), SQLite on local
# SSD, Redis for cache/session/queue. Replace noc.example.com and adjust the
# paths/FPM socket. Termination is outside this file; Certbot may add the
# certificate lines.
#
# The document root is `current/public`, never the application root, so `.env`,
# `storage/`, and the SQLite file are unreachable over HTTP. The deny rules are
# defence in depth.

server {
    listen 80;
    listen [::]:80;
    server_name noc.example.com;

    # Certbot HTTP-01 challenge, then HTTPS.
    location /.well-known/acme-challenge/ {
        root /var/www/noc/current/public;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name noc.example.com;

    # Managed by Certbot.
    # ssl_certificate     /etc/letsencrypt/live/noc.example.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/noc.example.com/privkey.pem;

    root /var/www/noc/current/public;
    index index.php;

    # Raw ingest bodies are capped at 65,536 bytes; 128k leaves headroom for
    # headers and any future small JSON endpoint.
    client_max_body_size 128k;

    charset utf-8;
    server_tokens off;

    add_header X-Frame-Options "DENY" always;

    access_log /var/log/nginx/noc-access.log;
    error_log  /var/log/nginx/noc-error.log;

    # Laravel Reverb WebSocket endpoint. `/app` carries the browser socket;
    # `/apps` carries server-to-server broadcasts from Laravel. Keep both on
    # loopback and let Nginx terminate TLS so port 8080 is never public.
    location ^~ /app {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location ^~ /apps {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_buffering off;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # Laravel front controller.
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # PHP-FPM. The versioned socket matches the recommended Ubuntu/Debian
    # package; change it if your PHP-FPM package uses another path.
    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.4-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        # TLS terminates at Nginx; without this FastCGI parameter Laravel sees
        # plain HTTP and refuses to set secure cookies / emit HSTS.
        fastcgi_param HTTPS $https if_not_empty;
        include fastcgi_params;
    }

    # Never serve dotfiles (.env, .git) except ACME challenges.
    location ~ /\.(?!well-known).* {
        deny all;
    }

    # Defence in depth: SQLite databases, journals, and shared-memory files
    # must live outside the document root, but deny them explicitly in case of
    # a misconfiguration.
    location ~* \.(?:sqlite|sqlite3|sqlite-journal|sqlite-wal|sqlite-shm|db|db-journal|db-wal|db-shm)$ {
        deny all;
    }

    location ~* ^/(?:composer\.(?:json|lock)|package(?:-lock)?\.json|artisan|phpunit\.xml)$ {
        deny all;
    }
}
